<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo Agendamento - Salão da Leila</title>
  <link rel="icon" type="image/svg+xml" href="imagens/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>

  <header>
    <a href="agendar.html" class="logo">
      <img src="imagens/logo.svg" alt="Logo do Salão da Leila" />
      <span class="logo-texto">
        <span class="logo-nome">Salão da Leila</span>
        <span class="logo-slogan">Area do cliente</span>
      </span>
    </a>

    <button class="botao-menu" id="botaoMenu" onclick="alternarMenu()" aria-label="Abrir menu">
      <i class="fa-solid fa-bars"></i>
    </button>

    <nav id="menuPrincipal">
      <a href="agendar.html" class="ativo"><i class="fa-solid fa-calendar-plus"></i>Agendar</a>
      <a href="meus-agendamentos.html"><i class="fa-solid fa-calendar-check"></i>Meus Agendamentos</a>
      <a href="historico.html"><i class="fa-solid fa-clock-rotate-left"></i>Histórico</a>
      <a href="#" onclick="sair()"><i class="fa-solid fa-right-from-bracket"></i>Sair</a>
    </nav>
  </header>

  <main>
    <h2 id="titulo">Novo agendamento</h2>
    <p class="subtitulo">Escolha os serviços, o dia e o horário</p>

    <h3><i class="fa-solid fa-list-check"></i> 1. Escolha os serviços</h3>
    <div class="lista-servicos" id="listaServicos"></div>

    <h3><i class="fa-solid fa-calendar-day"></i> 2. Escolha a data e o horário</h3>
    <div id="avisoMesmaSemana" class="aviso escondido"></div>

    <div class="filtros">
      <div class="campo">
        <label>Data</label>
        <input type="date" id="campoData" />
      </div>
      <div class="campo">
        <label>Horário</label>
        <input type="time" id="campoHora" min="09:00" max="19:00" step="1800" />
      </div>
    </div>

    <div class="resumo">
      <div>
        <div class="tempo">Total a pagar</div>
        <span class="valor" id="totalPreco">R$ 0,00</span>
      </div>
      <div class="tempo">
        <i class="fa-solid fa-hourglass-half"></i>
        Tempo no salão: <strong id="totalDuracao">0 min</strong>
      </div>
    </div>

    <p id="erroAgendar" class="erro"></p>

    <button onclick="confirmarAgendamento()"><i class="fa-solid fa-check"></i> Confirmar agendamento</button>
  </main>

  <footer>
    Salão da Leila © 2026 - Sistema de Agendamento
  </footer>

  <script src="js/menu.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/agendar.js"></script>
</body>
</html>
